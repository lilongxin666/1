name: Import nature-skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-nature-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/Yuan1z0825/nature-skills.git /tmp/nature-skills
          rm -rf /tmp/nature-skills/.git

      - name: Replace target contents with source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/nature-skills/. .

      - name: Commit imported repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to import.'
            exit 0
          fi
          git commit -m 'Import Yuan1z0825/nature-skills'
          git push origin HEAD:main
