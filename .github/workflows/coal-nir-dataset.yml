name: Build Coal NIR Dataset

on:
  push:
    paths:
      - '.github/workflows/coal-nir-dataset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user numpy pandas

      - name: Download and verify official Zenodo archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/extracted
          curl -L --fail --retry 5 --retry-delay 5 \
            'https://zenodo.org/records/11137126/files/Spectroscopy%20dataset.tgz?download=1' \
            -o work/Spectroscopy_dataset_original.tgz
          echo '26ff36e5d59ddae1862eb887f728a5ae  work/Spectroscopy_dataset_original.tgz' | md5sum -c -
          tar -xzf work/Spectroscopy_dataset_original.tgz -C work/extracted

      - name: Download pinned organizer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            'https://raw.githubusercontent.com/lilongxin666/1/0a9bed225ed95fb36f740e804d73b2754e99d501/scripts/organize_coal_nir.py' \
            -o work/organize_coal_nir.py

      - name: Build analysis-ready dataset
        shell: bash
        run: |
          set -euo pipefail
          python3 work/organize_coal_nir.py
          cd work
          zip -r -9 coal_nir_organized.zip organized >/dev/null
          ls -lh coal_nir_organized.zip organized/Coal_NIR_All.csv.gz organized/Coal_NIR_Metadata.csv

      - name: Upload organized dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: coal-nir-organized
          path: work/coal_nir_organized.zip
          if-no-files-found: error
          retention-days: 7
